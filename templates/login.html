{% extends "base.html" %}
{% block title %}Log in | AG Realty{% endblock %}
{% block content %}
<section class="wrap narrow-s page-pad">
  <div class="side-card">
    <h1 class="h2">Log in</h1>
    <form class="form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ request.args.next or '' }}">
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn btn-gold">Log in</button>
    </form>
    <p class="note">New to AG Realty? <a href="{{ url_for('register', next=request.args.next) }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
