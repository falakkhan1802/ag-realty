{% extends "base.html" %}
{% block title %}Create account | AG Realty{% endblock %}
{% block content %}
<section class="wrap narrow-s page-pad">
  <div class="side-card">
    <h1 class="h2">Create your account</h1>
    <form class="form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ request.args.next or '' }}">
      <label>Full name<input name="name" required autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
      <label>Password (8+ characters)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
      <label>Confirm password<input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label>
      <button class="btn btn-gold">Create account</button>
    </form>
    <p class="note">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
